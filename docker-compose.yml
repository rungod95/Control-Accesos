version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-control_accesos}
      POSTGRES_USER: ${DB_USER:-accesos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-accesos123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./control-accesos-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-control_accesos}
      DB_USER: ${DB_USER:-accesos_user}
      DB_PASSWORD: ${DB_PASSWORD:-accesos123}
      JWT_SECRET: ${JWT_SECRET:-YWFhYmJiY2NjZGRkZWVlZmZmMTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTA=}
    depends_on:
      - db
    ports:
      - "8080:8080"

  pwa:
    build:
      context: ./control-accesos-pwa
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api:8080}
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
